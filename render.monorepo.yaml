services:
  - type: web
    name: gp-level-hub-spoke-app
    runtime: node
    rootDir: "Research Map/GP level/hub-spoke-app"
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
